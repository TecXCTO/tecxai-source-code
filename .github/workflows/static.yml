name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Project Dependencies
        run: bun install

      - name: Compile Production Build Folder
        run: bun run build

      - name: Upload Compiled Static Dist Folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy Compiled Package to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
